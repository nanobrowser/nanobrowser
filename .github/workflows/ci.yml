# Checks every push and pull request: formatting, lint, types, unit tests and a build.
# The browser checks (pnpm autorun) and the checks that call real models are run by hand before a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # Actions are pinned to a commit, not a tag that could be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # corepack runs the pnpm version pinned in package.json (packageManager).
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
