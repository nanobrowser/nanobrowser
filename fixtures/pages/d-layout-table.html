<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Layout table</title></head>
<body>
<!-- A page laid out with a table and "|" separators between links, as Hacker News is. -->
<table border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td><a href="#top">Top</a> | <a href="#new">new</a> | <a href="#past">past</a> · <a href="#ask">ask</a></td>
    <td align="right"><a href="#login">login</a></td>
  </tr>
  <tr>
    <td colspan="2">Stories from today</td>
  </tr>
</table>
</body>
</html>
