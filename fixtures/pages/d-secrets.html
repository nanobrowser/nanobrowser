<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Secrets</title><link rel="stylesheet" href="/style.css"></head>
<body>
<h1>Secrets</h1>
<form id="secrets" action="/submit" method="post">
  <label>Access key <input type="password" id="key" name="k" value="hunter2"></label>
  <label>Verification <input type="text" id="otp" name="v" autocomplete="one-time-code" value="246810"></label>
</form>
<div id="many"></div>
<script>
  // ?fields=N: N filled text fields, then a one-time-code field with a neutral label and name, so it comes after the
  // capture's attribute lookups run out.
  const n = Number(new URLSearchParams(location.search).get('fields') ?? 0);
  const many = document.getElementById('many');
  for (let i = 1; i <= n; i++) {
    const label = document.createElement('label');
    label.textContent = `Field ${i} `;
    const input = document.createElement('input');
    input.value = `value ${i}`;
    label.append(input);
    many.append(label);
  }
  if (n) {
    const label = document.createElement('label');
    label.textContent = 'Reference ';
    const input = document.createElement('input');
    input.id = 'late-code';
    input.autocomplete = 'one-time-code';
    input.value = '654321';
    label.append(input);
    many.append(label);
  }
</script>
</body>
</html>
