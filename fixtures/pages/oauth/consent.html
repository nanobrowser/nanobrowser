<!doctype html>
<!-- Set G: a consent page, recognised by its address path. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Allow access?</title></head>
  <body>
    <h1>Example App wants to access your account</h1>
    <form method="post" onsubmit="event.preventDefault(); window.granted = true">
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
